name: Build YMYVerb for Windows

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: VST3 and Setup.exe (x64)
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) {
            throw "Could not install Inno Setup. The installer stage cannot be verified."
          }

      - name: Build VST3 and installer
        shell: pwsh
        run: ./BUILD-WINDOWS.ps1 -NoPause

      - name: Verify deliverables
        shell: pwsh
        run: |
          $plugin = Join-Path $env:GITHUB_WORKSPACE "dist\YMYVerb.vst3"
          $installer = Join-Path $env:GITHUB_WORKSPACE "dist\YMYVerb-Setup.exe"
          if (-not (Test-Path (Join-Path $plugin "Contents\x86_64-win\YMYVerb.vst3"))) {
            # JUCE bundles may vary by generator; the bundle must contain at least one VST3 binary.
            $binary = Get-ChildItem -Path $plugin -Recurse -File -Filter "*.vst3" -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $binary) { throw "VST3 binary was not found in the staged plugin bundle." }
          }
          if (-not (Test-Path $installer)) {
            throw "YMYVerb-Setup.exe was not generated."
          }
          Get-Item $installer | Select-Object FullName, Length

      - name: Upload Windows deliverables
        uses: actions/upload-artifact@v4
        with:
          name: YMYVerb-Windows-x64
          path: |
            dist/YMYVerb.vst3/**
            dist/YMYVerb-Setup.exe
          if-no-files-found: error
          retention-days: 14
